<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,intial-scale=1.0">
        
        <title>Salary</title>
    </head>
    <body>
        <script>
            let salary=[37000,17000,25000,32000,48000,65000,80000];
            for(i=0; i<salary.length; i++){
            if(salary [i] < 30000){
             salary [i] = salary[i]+(salary[i]*0.10);
            }else if(salary [i] > 30000){
                salary [i] = salary[i]+(salary[i]*0.15);
            }
            alert("employee"+(i+1)+":Rs" +salary[i]+"\n");
        }
        </script>
    </body>
</html>
