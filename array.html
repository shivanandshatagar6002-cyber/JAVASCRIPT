<!DOCTYPE html>
<html>
<head>
<title>Array Example</title>
</head>
<body>
<script>
let array1=["a","b","c","d","e"],n=4;
for(let i=0;i<n;i++)
{
    if(i==3){
        document.write("HI");
        break;
    }
    document.write(array1[i]);
}
let i=4;
while(i<5)
{
    document.write("Hi");
    i=i++;
}
</script>
</body>
</html>
